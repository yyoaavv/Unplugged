name: Build Android APK

# Runs when you push to main/master, or by hand from the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Collect the web files
        run: |
          mkdir www
          cp index.html manifest.json favicon.svg icon.svg icon-maskable.svg apple-touch-icon.png www/
          # sw.js is left out on purpose: the app files are already inside the APK

      - name: Make the app icon sources
        run: |
          mkdir assets
          ROBOT='<g transform="translate(512 512) scale(17.6) translate(-32 -25)" fill="#fff"><rect x="23" y="9" width="4" height="10" rx="2"/><rect x="37" y="9" width="4" height="10" rx="2"/><rect x="18" y="19" width="28" height="15" rx="5"/><rect x="29" y="34" width="6" height="7" rx="2"/><circle cx="25.5" cy="26.5" r="3" fill="#4a4fb0"/><circle cx="38.5" cy="26.5" r="3" fill="#4a4fb0"/></g>'
          ROBOT_BIG="${ROBOT/scale(17.6)/scale(20.8)}"
          HEAD='<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">'
          echo "$HEAD<rect width=\"1024\" height=\"1024\" rx=\"226\" fill=\"#4a4fb0\"/>$ROBOT_BIG</svg>" > icon-only.svg
          echo "$HEAD$ROBOT</svg>" > icon-foreground.svg
          echo "$HEAD<rect width=\"1024\" height=\"1024\" fill=\"#4a4fb0\"/></svg>" > icon-background.svg
          for n in icon-only icon-foreground icon-background; do
            rsvg-convert -w 1024 -h 1024 $n.svg -o assets/$n.png
          done
          rm icon-only.svg icon-foreground.svg icon-background.svg
          ls -l assets

      - name: Create the Android project
        run: npx cap add android

      - name: Add permissions (vibration, notifications)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' "$MANIFEST"

      - name: Make the app icons
        run: npx capacitor-assets generate --android

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unplugged-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
