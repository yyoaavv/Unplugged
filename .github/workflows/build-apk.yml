name: Build Android APK

# Runs when you push to main/master, or by hand from the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Collect the web files
        run: |
          mkdir -p www/assets/images
          cp index.html manifest.json www/
          cp assets/images/favicon.svg assets/images/icon.svg assets/images/icon-maskable.svg assets/images/apple-touch-icon.png www/assets/images/
          # sw.js is left out on purpose: the app files are already inside the APK

      - name: Make the app icon sources
        run: |
          mkdir -p assets
          cp assets/images/icon-only.png assets/images/icon-foreground.png assets/images/icon-background.png assets/
          ls -l assets

      - name: Create the Android project
        run: npx cap add android

      - name: Add permissions (vibration, notifications)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' "$MANIFEST"

      - name: Make the app icons
        run: npx capacitor-assets generate --android

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unplugged-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
